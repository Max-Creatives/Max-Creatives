services:
  - type: web
    name: max-outreach-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --no-fund && npm run build
    startCommand: bash scripts/start-hosted.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: max-outreach-db
          property: connectionString
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false

databases:
  - name: max-outreach-db
    plan: free
    databaseName: max_outreach
    user: max_outreach
    ipAllowList: []
